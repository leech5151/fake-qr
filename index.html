<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비플리끄 한우 오마카세 - 리뷰 참여</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background: linear-gradient(135deg, #5a2eeb 0%, #5a8be8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .highlight {
      color: #5a2eeb;
      font-weight: 600;
    }

    .cta-button {
      display: inline-block;
      width: 100%;
      padding: 1.2rem 2rem;
      background: linear-gradient(135deg, #5a2eeb, #5a8be8);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 20px rgba(90, 46, 235, 0.3);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .cta-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(90, 46, 235, 0.4);
    }

    .cta-button:active {
      transform: translateY(-2px);
    }

    .arrow {
      font-size: 1.3rem;
    }

    .info-box {
      background: #f5f5f5;
      border-left: 4px solid #5a2eeb;
      padding: 1.25rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .info-box h3 {
      color: #1a1a1a;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .info-box p {
      color: #555;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }

    .info-box p:last-child {
      margin-bottom: 0;
    }

    .steps {
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .step {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.25rem;
      align-items: flex-start;
    }

    .step-number {
      background: #5a2eeb;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step-content h4 {
      color: #1a1a1a;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .step-content p {
      color: #666;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .footer-note {
      font-size: 0.8rem;
      color: #999;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }

    @media (max-width: 480px) {
      .container {
        padding: 1.75rem;
      }

      h1 {
        font-size: 1.45rem;
      }

      .cta-button {
        padding: 1rem 1.5rem;
        font-size: 1rem;
      }

      .info-box {
        padding: 1rem;
      }

      .step {
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍽️</div>
    
    <h1>비플리끄 한우 오마카세</h1>
    <p class="subtitle">방문해주신 고객님께 특별한 감사의 인사를 드립니다.</p>

    <div class="info-box">
      <h3>리뷰 참여 시 혜택</h3>
      <p>✨ 간단한 설문조사 참여</p>
      <p>📸 방문 경험 공유</p>
      <p>🎁 추첨을 통한 특별 이벤트 참여 기회</p>
    </div>

    <button class="cta-button" onclick="goToReview()">
      <span>리뷰 페이지로 이동</span>
      <span class="arrow">→</span>
    </button>

    <div class="steps">
      <h3 style="color: #1a1a1a; margin-bottom: 1rem;">진행 순서</h3>
      
      <div class="step">
        <div class="step-number">1</div>
        <div class="step-content">
          <h4>영상 시청</h4>
          <p>약 15초의 짧은 영상을 감상해주세요.</p>
        </div>
      </div>

      <div class="step">
        <div class="step-number">2</div>
        <div class="step-content">
          <h4>설문조사 참여</h4>
          <p>간단한 질문에 답변해주세요.</p>
        </div>
      </div>

      <div class="step">
        <div class="step-number">3</div>
        <div class="step-content">
          <h4>솔직한 리뷰 작성</h4>
          <p>방문 경험과 소감을 남겨주세요.</p>
        </div>
      </div>
    </div>

    <p class="footer-note">소요 시간: 약 2-3분 | 복잡하지 않아요! 😊</p>
  </div>

  <script>
    function goToReview() {
      window.location.href = 'review.html';
    }
  </script>
</body>
</html>
